<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 AI 에이전트</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height:100%; }
  body { display:flex; flex-direction:column; }
  .wrap { flex:1; min-height:0; display:flex; justify-content:center; padding-bottom:18px; }
  .chat { width:100%; max-width:1160px; background:var(--panel); border:1px solid var(--border); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  .wbar { display:flex; align-items:center; gap:18px; padding:12px 20px; border-bottom:1px solid var(--border); background:var(--soft); flex-wrap:wrap; }
  .wbar .t { font-weight:700; white-space:nowrap; } .wbar .t small { font-weight:400; color:var(--muted); margin-left:6px; }
  .wbar .v { white-space:nowrap; } .wbar .v small { color:var(--muted); font-size:12px; margin-right:6px; } .wbar .v b { font-size:15px; }
  .wbar .lim { flex:1; min-width:220px; display:flex; align-items:center; gap:10px; font-size:12.5px; white-space:nowrap; }
  .wbar .lim .bar { flex:1; background:#dde2ea; }
  .sep { width:1px; height:22px; background:var(--border); }
  .wbar .btn { padding:5px 12px; font-size:13px; }
  .banner { padding:8px 20px; font-size:13px; background:var(--warn-bg); color:var(--warn); border-bottom:1px solid var(--warn-line); }
  .msgs { flex:1; min-height:0; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .hello { align-self:center; text-align:center; color:var(--muted); margin:auto 0; padding:30px 10px; }
  .hello b { display:block; color:var(--text); font-size:18px; margin-bottom:4px; }
  .b { max-width:min(72%, 680px); padding:10px 14px; border-radius:16px; overflow-wrap:anywhere; }
  .u { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .a { align-self:flex-start; background:var(--soft); border-bottom-left-radius:4px; }
  .a.bad { background:var(--bad-bg); }
  .who { font-size:11.5px; color:var(--muted); margin-bottom:3px; } .u .who { color:rgba(255,255,255,.8); text-align:right; }
  .typing { color:var(--muted); }
  .typing::after { content:"…"; animation:blink 1s infinite; } @keyframes blink { 50% { opacity:.2; } }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:4px 12px; margin-top:8px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  td, th { padding:6px 8px; text-align:right; font-size:13px; border-bottom:1px dashed var(--border); white-space:nowrap; }
  th { color:var(--muted); font-weight:400; font-size:12px; }
  td:first-child, th:first-child { text-align:left; padding-left:0; }
  tr:last-child td { border-bottom:0; }
  .up { color:var(--up); font-weight:700; } .down { color:var(--down); font-weight:700; }
  .pill { display:inline-flex; gap:6px; align-items:center; font:600 12px/1.5 inherit; background:var(--ok-bg); color:var(--ok); padding:2px 10px; border-radius:999px; margin-top:8px; border:0; cursor:pointer; }
  .paid { margin-top:6px; border:1px solid #cfe9d9; background:#f6fcf8; border-radius:10px; padding:6px 12px; font-size:12.5px; }
  .paid .r { display:flex; justify-content:space-between; gap:16px; padding:3px 0; flex-wrap:wrap; }
  .paid .r a, .paid .r .addr { font-size:12px; }
  .approve { background:var(--warn-bg); border:1px solid var(--warn-line); }
  .approve .acts { display:flex; gap:8px; margin-top:10px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:10px 20px 8px; }
  .chip { font-weight:400; font-size:12.5px; padding:5px 12px; border-radius:999px; background:var(--soft); }
  .clear { margin-left:auto; font-weight:400; font-size:12.5px; padding:5px 12px; border-radius:999px; color:var(--muted); background:transparent; }
  .clear.armed { color:var(--bad); border-color:var(--bad); }
  form { margin:0 20px 18px; display:flex; gap:8px; border:1px solid var(--border); border-radius:12px; padding:6px 6px 6px 14px; }
  form input { flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:14.5px; }
  form:focus-within { border-color:var(--accent); }
  @media (max-width: 720px) { .wrap { padding:0; } .chat { border-radius:0; border-width:0; } .b { max-width:88%; } .sep { display:none; } }
</style>
</head>
<body>
<div class="top">
  <span class="brand"><span class="lg">🤖</span><span><b>내 AI 에이전트</b><small>대화하면 알아서 결제해요</small></span></span>
  <span class="net">Ethereum Sepolia</span>
</div>
<div class="wrap">
  <section class="chat">
    <div class="wbar">
      <span class="t">🤖 내 에이전트 지갑<small class="addr" id="w-addr">…</small></span>
      <span class="sep"></span>
      <span class="v"><small>DEMO 잔액</small><b class="num" id="w-demo">…</b></span>
      <span class="v"><small>ETH (가스비)</small><b class="num" id="w-eth">…</b></span>
      <span class="sep"></span>
      <span class="lim"><span class="muted" id="w-window">한도</span><span class="bar" id="w-bar"><i style="width:0"></i></span><span class="num" id="w-usage">…</span></span>
      <a class="btn" href="/agent/wallet">⚙️ 지갑 설정</a>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="msgs" id="msgs">
      <div class="hello" id="hello"><b>무엇을 도와드릴까요?</b>데모증권의 시세 조회, 잔고 확인, 주식 주문을 대신 하고 이용료도 알아서 결제할게요.</div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" type="button">삼성전자 시세 알려줘</button>
      <button class="chip" type="button">내 주식 수익률 알려줘</button>
      <button class="chip" type="button">내 잔고 보여줘</button>
      <button class="chip" type="button">삼성전자 1주 사줘</button>
      <button class="clear" type="button" id="clear">🗑 대화 지우기</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="에이전트에게 부탁할 일을 입력하세요…" aria-label="메시지">
      <button class="p" type="submit" id="send">보내기</button>
    </form>
  </section>
</div>

<script>
const DECIMALS = 6n;
const STOCKS = [
  { sym: "005930", name: "삼성전자", cur: "KRW", alias: ["삼성전자", "삼성", "005930"] },
  { sym: "AAPL", name: "애플", cur: "USD", alias: ["애플", "apple", "aapl"] },
  { sym: "TSLA", name: "테슬라", cur: "USD", alias: ["테슬라", "tesla", "tsla"] },
];
const stockBySym = (sym) => STOCKS.find((s) => s.sym === sym) ?? { sym, name: sym, cur: "USD" };

const $ = (id) => document.getElementById(id);
// Labels say "DEMO"; once the server reports the payment token, its symbol replaces it everywhere.
let SYM = "DEMO";
function relabel(root) {
  if (SYM === "DEMO" || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = walker.nextNode());) if (n.nodeValue.includes("DEMO")) n.nodeValue = n.nodeValue.replace(/DEMO/g, SYM);
}
new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) relabel(n.nodeType === Node.TEXT_NODE ? n.parentNode : n); })
  .observe(document.body, { childList: true, subtree: true });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function demo(raw) {
  if (raw == null) return "–";
  const v = BigInt(raw), unit = 10n ** DECIMALS;
  const frac = (v % unit).toString().padStart(Number(DECIMALS), "0").replace(/0+$/, "");
  return (v / unit).toString() + (frac ? "." + frac : "");
}
const money = (v, cur) => cur === "KRW" ? `${Math.round(v).toLocaleString("ko-KR")}원` : `$${v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const pct = (v) => `${v >= 0 ? "+" : ""}${(v * 100).toFixed(2)}%`;
const tone = (v) => v >= 0 ? "up" : "down";
const short = (a) => a ? `${a.slice(0, 6)}…${a.slice(-4)}` : "";

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ?? `HTTP ${res.status}`);
  return data;
}

// ------------------------------------------------------------ wallet bar

let summary = null;
const WINDOW_NAME = { 1800: "30분", 3600: "1시간", 86400: "하루" };
async function refresh() {
  try { summary = await api("GET", "/api/agent/summary"); } catch { return; }
  if (summary.token?.symbol && summary.token.symbol !== SYM) { SYM = summary.token.symbol; relabel(document.body); }
  const s = summary, st = s.settings;
  $("w-addr").textContent = short(s.address);
  $("w-demo").textContent = demo(s.demo);
  $("w-eth").textContent = (Number(BigInt(s.eth)) / 1e18).toFixed(4).replace(/\.?0+$/, "") || "0";
  $("w-window").textContent = `${WINDOW_NAME[st.windowSeconds] ?? `${st.windowSeconds}초`} 한도`;
  const ratio = Math.min(1, Number(BigInt(s.usage)) / Math.max(1, Number(BigInt(st.perWindow))));
  $("w-bar").querySelector("i").style.width = `${ratio * 100}%`;
  $("w-bar").classList.toggle("over", ratio >= 1);
  $("w-usage").textContent = `${demo(s.usage)} / ${demo(st.perWindow)} DEMO`;
  const notes = [];
  if (!s.policyActive) notes.push("결제 권한이 꺼져 있어요. 지갑 설정에서 켜 주세요.");
  else if (!st.securities) notes.push("데모증권이 사용처에서 꺼져 있어요.");
  if (!s.settlementEnabled) notes.push("정산 키(FACILITATOR_PRIVATE_KEY)가 없어 블록체인 정산이 꺼져 있어요.");
  $("banner").hidden = notes.length === 0;
  $("banner").textContent = notes.join(" ");
  document.querySelectorAll(".paid").forEach(renderPaid);
}

// ------------------------------------------------------------ messages

const msgs = $("msgs");
const HELLO = msgs.innerHTML; // the empty-chat greeting, restored by "대화 지우기"
function save() { try { sessionStorage.setItem("agent-chat", msgs.innerHTML); } catch {} }
function restore() { try { const html = sessionStorage.getItem("agent-chat"); if (html) msgs.innerHTML = html; } catch {} }
function scroll() { msgs.scrollTop = msgs.scrollHeight; }
function addUser(text) {
  $("hello")?.remove();
  msgs.insertAdjacentHTML("beforeend", `<div class="b u"><div class="who">나</div>${esc(text)}</div>`);
  scroll(); save();
}
function addAgent(html, cls = "") {
  const el = document.createElement("div");
  el.className = `b a ${cls}`;
  el.innerHTML = `<div class="who">AI 에이전트</div>${html}`;
  msgs.append(el); scroll(); save();
  return el;
}
function typing() { return addAgent(`<span class="typing">확인하고 있어요</span>`); }

// Payments made for one answer: a pill that expands to per-payment status and transaction links.
function paidPill(payments) {
  if (!payments.length) return "";
  const total = payments.reduce((s, p) => s + BigInt(p.amount), 0n);
  const data = esc(JSON.stringify(payments));
  return `<div><button class="pill" type="button" data-toggle>✓ ${demo(total)} DEMO 결제${payments.length > 1 ? ` · ${payments.length}건` : ""} <span>▸</span></button></div>
    <div class="paid" data-payments="${data}" hidden></div>`;
}
function renderPaid(el) {
  const payments = JSON.parse(el.dataset.payments);
  const status = summary?.payments ?? {};
  el.innerHTML = payments.map((p) => {
    const s = status[p.nonce];
    let right = `<span class="muted">정산 대기</span>`;
    if (s?.status === "settled") right = `<a href="${summary.explorer}/tx/${s.txHash}" target="_blank" rel="noopener" class="addr">${short(s.txHash)} ↗</a>`;
    else if (s?.status === "settling" || s?.status === "verified") right = `<span class="muted">정산 중…</span>`;
    else if (s?.status === "failed") right = `<span class="error">정산 실패</span>`;
    return `<div class="r"><span>${esc(p.label)}</span><span>${demo(p.amount)} DEMO · ${right}</span></div>`;
  }).join("");
}

msgs.addEventListener("click", (e) => {
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) {
    const box = toggle.parentElement.nextElementSibling;
    box.hidden = !box.hidden;
    toggle.querySelector("span").textContent = box.hidden ? "▸" : "▾";
    if (!box.hidden) renderPaid(box);
    save(); scroll();
    return;
  }
  const act = e.target.closest("[data-approval]");
  if (act) resolveApproval(act);
});

// ------------------------------------------------------------ understanding requests

function findStocks(text) {
  const t = text.toLowerCase();
  return STOCKS.filter((s) => s.alias.some((a) => t.includes(a.toLowerCase())));
}
function understand(text) {
  const stocks = findStocks(text);
  if (/(사\s*줘|사줄래|매수|팔아|매도|주문)/.test(text)) {
    if (!stocks.length) return { kind: "ask", text: "어떤 종목을 주문할까요? 삼성전자, 애플, 테슬라를 다룰 수 있어요." };
    const qty = Math.max(1, Number(text.match(/(\d+)\s*주/)?.[1] ?? 1));
    return { kind: "order", stock: stocks[0], qty, side: /(팔아|매도)/.test(text) ? "sell" : "buy" };
  }
  if (/수익/.test(text)) return { kind: "returns" };
  if (/(잔고|보유|포트폴리오|자산)/.test(text)) return { kind: "portfolio" };
  if (stocks.length) return { kind: "quotes", stocks };
  if (/(시세|현재가|가격|주가|얼마)/.test(text)) return { kind: "ask", text: "어떤 종목의 시세를 볼까요? 삼성전자, 애플, 테슬라를 조회할 수 있어요." };
  return { kind: "ask", text: "아직은 데모증권의 <b>시세 조회</b>, <b>잔고·수익률 확인</b>, <b>주식 주문</b>을 할 수 있어요." };
}

const calls = {
  quote: (s) => ({ kind: "quote", method: "GET", path: `/securities/quotes/${s.sym}`, label: `실시간 시세 · ${s.name}`, meta: { sym: s.sym } }),
  portfolio: () => ({ kind: "portfolio", method: "GET", path: "/securities/portfolio", label: "잔고 조회" }),
  order: (s, qty, side) => ({ kind: "order", method: "POST", path: "/securities/orders", body: { symbol: s.sym, side, quantity: qty },
    label: `주식 주문 · ${s.name} ${qty}주 ${side === "buy" ? "매수" : "매도"}`, meta: { sym: s.sym } }),
};

const REASONS = [
  [/maxAmountPerTx/, "1회 결제 한도를 넘어요"],
  [/maxAmountPerWindow/, "기간 결제 한도를 넘어요"],
  [/not allowed by delegation/, "데모증권이 사용처에서 꺼져 있어요"],
  [/no active delegation/, "결제 권한이 꺼져 있어요"],
  [/insufficient balance/, "지갑의 DEMO가 부족해요"],
  [/expired|not yet valid/, "결제 유효 시간이 맞지 않아요"],
];
const why = (r) => REASONS.find(([re]) => re.test(r ?? ""))?.[1] ?? (r || "알 수 없는 이유");

// One paid call. Returns { data, payment } or throws a user-facing { stop } describing what happened.
async function pay(call) {
  const r = await api("POST", "/api/agent/pay", { method: call.method, path: call.path, body: call.body, label: call.label });
  if (r.ok) return { data: r.data, payment: r.payment };
  if (r.needsApproval) throw { stop: approvalCard(call, r) };
  if (r.denied) throw { stop: { html: deniedText(call, r), bad: true } };
  if (r.failed) throw { stop: { html: `결제가 거부됐어요. ${esc(why(r.reason))}.${/insufficient/.test(r.reason) ? ` <a href="/agent/wallet">지갑 충전하기 →</a>` : ""}`, bad: true } };
  throw { stop: { html: `서비스가 응답하지 않았어요 (HTTP ${r.status}).`, bad: true } };
}

// The period limit is a hard cap: no approval offered, just how much of it is left.
function deniedText(call, r) {
  if (r.window) {
    const name = WINDOW_NAME[r.window.seconds] ?? `${r.window.seconds}초`;
    const left = BigInt(r.window.limit) - BigInt(r.window.usage);
    return `${esc(call.label)}에 <b>${demo(r.amount)} DEMO</b>가 필요한데, ${name} 한도 ${demo(r.window.limit)} DEMO 중
      ${demo(r.window.usage)} DEMO를 이미 써서 결제할 수 없어요.${left > 0n ? ` 남은 한도는 ${demo(left)} DEMO예요.` : ""}
      <a href="/agent/wallet">한도 설정 →</a>`;
  }
  return `${esc(call.label)}에 <b>${demo(r.amount)} DEMO</b>가 필요한데 결제하지 않았어요. ${esc(why(r.reason))}.`;
}

function approvalCard(call, r) {
  return {
    cls: "approve",
    html: `${esc(call.label)}에 <b>${demo(r.amount)} DEMO</b>가 필요해요. 1회 한도(${demo(summary?.settings.perTx)} DEMO)를 넘어서 확인을 받을게요.
      <div class="acts" data-call="${esc(JSON.stringify(call))}">
        <button class="p" type="button" data-approval="${r.approvalId}" data-approve="1">결제하기</button>
        <button type="button" data-approval="${r.approvalId}" data-approve="0">취소</button>
      </div>`,
  };
}

// Text + card for a single successful call (used for answers and for approved payments).
function describe(call, data) {
  if (call.kind === "quote") {
    const s = stockBySym(call.meta.sym);
    return `${esc(s.name)} 현재가는 <b class="up">${money(data.price, s.cur)}</b>이에요.`;
  }
  if (call.kind === "portfolio") return `보유 종목은 ${data.holdings.length}개예요.${holdingsTable(data.holdings)}`;
  if (call.kind === "order") {
    const s = stockBySym(data.symbol);
    return `${esc(s.name)} ${data.quantity}주 ${data.side === "buy" ? "매수" : "매도"} 주문이 <b>체결</b>됐어요.
      <div class="card"><table><tr><td>주문번호</td><td class="addr">${esc(data.orderId)}</td></tr><tr><td>상태</td><td><span class="badge b-ok">체결</span></td></tr></table></div>`;
  }
  return "완료했어요.";
}
function holdingsTable(holdings, quotes = {}) {
  const rows = holdings.map((h) => {
    const s = stockBySym(h.symbol), q = quotes[h.symbol];
    const ret = q != null ? (q - h.avgPrice) / h.avgPrice : null;
    return `<tr><td>${esc(s.name)}</td><td>${h.quantity}주</td><td>${money(h.avgPrice, s.cur)}</td>
      ${q != null ? `<td>${money(q, s.cur)}</td><td class="${tone(ret)}">${pct(ret)}</td>` : ""}</tr>`;
  }).join("");
  const head = Object.keys(quotes).length ? "<th>현재가</th><th>수익률</th>" : "";
  return `<div class="card"><table><tr><th>종목</th><th>수량</th><th>평균 단가</th>${head}</tr>${rows}</table></div>`;
}

async function handle(text) {
  const intent = understand(text);
  if (intent.kind === "ask") { addAgent(intent.text); return; }
  const bubble = typing();
  const payments = [];
  const run = async (call) => { const r = await pay(call); payments.push(r.payment); return r.data; };
  let html;
  try {
    if (intent.kind === "quotes") {
      const results = [];
      for (const s of intent.stocks) results.push([s, await run(calls.quote(s))]);
      html = results.length === 1
        ? describe(calls.quote(results[0][0]), results[0][1])
        : `${results.length}개 종목의 현재가예요.<div class="card"><table>${results.map(([s, d]) =>
            `<tr><td>${esc(s.name)} <span class="muted">${s.sym}</span></td><td class="up">${money(d.price, s.cur)}</td></tr>`).join("")}</table></div>`;
    } else if (intent.kind === "portfolio") {
      html = describe(calls.portfolio(), await run(calls.portfolio()));
    } else if (intent.kind === "returns") {
      const { holdings } = await run(calls.portfolio());
      const quotes = {};
      for (const h of holdings) quotes[h.symbol] = (await run(calls.quote(stockBySym(h.symbol)))).price;
      const cost = holdings.reduce((s, h) => s + h.avgPrice * h.quantity, 0);
      const value = holdings.reduce((s, h) => s + quotes[h.symbol] * h.quantity, 0);
      const sameCur = new Set(holdings.map((h) => stockBySym(h.symbol).cur)).size === 1;
      const cur = stockBySym(holdings[0]?.symbol).cur;
      const best = [...holdings].sort((a, b) => (quotes[b.symbol] / b.avgPrice) - (quotes[a.symbol] / a.avgPrice))[0];
      html = `보유하신 ${holdings.length}종목의 전체 수익률은 <b class="${tone(value - cost)}">${pct((value - cost) / cost)}</b>${sameCur ? ` (${value - cost >= 0 ? "+" : "−"}${money(Math.abs(value - cost), cur)})` : ""}예요.
        ${best ? `${esc(stockBySym(best.symbol).name)}가 가장 많이 올랐어요.` : ""}${holdingsTable(holdings, quotes)}`;
    } else if (intent.kind === "order") {
      const call = calls.order(intent.stock, intent.qty, intent.side);
      html = describe(call, await run(call));
    }
    bubble.innerHTML = `<div class="who">AI 에이전트</div>${html}${paidPill(payments)}`;
  } catch (err) {
    const stop = err?.stop ?? { html: `처리 중 오류가 났어요: ${esc(err?.message ?? err)}`, bad: true };
    const done = payments.length ? `<div class="muted" style="margin-bottom:6px">여기까지 진행했어요.</div>${paidPill(payments)}` : "";
    bubble.className = `b a ${stop.cls ?? (stop.bad ? "bad" : "")}`;
    bubble.innerHTML = `<div class="who">AI 에이전트</div>${stop.html}${done}`;
  }
  scroll(); save(); refresh();
}

async function resolveApproval(btn) {
  const box = btn.closest(".acts");
  const call = JSON.parse(box.dataset.call);
  const approve = btn.dataset.approve === "1";
  box.querySelectorAll("button").forEach((b) => (b.disabled = true));
  addUser(approve ? "결제할게" : "취소할게");
  if (!approve) {
    try { await api("POST", "/api/agent/approval", { id: btn.dataset.approval, approve: false }); } catch {}
    box.outerHTML = `<div class="muted" style="margin-top:8px">취소했어요.</div>`;
    addAgent("알겠어요. 결제하지 않았어요.");
    refresh();
    return;
  }
  box.outerHTML = `<div class="muted" style="margin-top:8px">승인했어요.</div>`;
  const bubble = typing();
  try {
    const r = await api("POST", "/api/agent/approval", { id: btn.dataset.approval, approve: true });
    if (r.denied) {
      bubble.className = "b a bad";
      bubble.innerHTML = `<div class="who">AI 에이전트</div>${deniedText(call, r)}`;
    } else if (!r.ok) {
      throw new Error(why(r.reason));
    } else {
      bubble.innerHTML = `<div class="who">AI 에이전트</div>${describe(call, r.data)}${paidPill([r.payment])}`;
    }
  } catch (err) {
    bubble.className = "b a bad";
    bubble.innerHTML = `<div class="who">AI 에이전트</div>결제하지 못했어요: ${esc(err.message)}`;
  }
  scroll(); save(); refresh();
}

// ------------------------------------------------------------ input

let busy = false;
async function submit(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true;
  addUser(text);
  try { await handle(text); } finally { busy = false; $("send").disabled = false; $("input").focus(); }
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; submit(t); });
$("chips").addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (c) submit(c.textContent); });

// Two clicks within 3 seconds, so a stray click during a demo doesn't wipe the conversation.
let clearTimer = null;
$("clear").addEventListener("click", async () => {
  const btn = $("clear");
  if (busy) return;
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed");
    btn.textContent = "한 번 더 누르면 지워져요";
    clearTimer = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "🗑 대화 지우기"; }, 3000);
    return;
  }
  clearTimeout(clearTimer);
  btn.classList.remove("armed");
  btn.textContent = "🗑 대화 지우기";
  // Approval requests still waiting in this chat are cancelled, so none is left pending.
  const pending = [...new Set([...msgs.querySelectorAll("[data-approval]:not(:disabled)")].map((b) => b.dataset.approval))];
  await Promise.all(pending.map((id) => api("POST", "/api/agent/approval", { id, approve: false }).catch(() => {})));
  msgs.innerHTML = HELLO;
  try { sessionStorage.removeItem("agent-chat"); } catch {}
  refresh();
  $("input").focus();
});

restore();
scroll();
refresh();
setInterval(refresh, 3000);
</script>
